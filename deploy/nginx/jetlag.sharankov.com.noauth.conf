# Host nginx site WITHOUT Authelia, for getting started:
#   sudo cp deploy/nginx/jetlag.sharankov.com.noauth.conf /etc/nginx/sites-available/jetlag.sharankov.com
#
# Anyone with the address can use the app, its place search and map queries,
# so requests are rate-limited per visitor. To add a simple shared password,
# uncomment the two auth_basic lines below (see deploy/FIRST-DEPLOY.md).
# Switch to jetlag.sharankov.com.conf (with Authelia) later.

# Per-visitor limits for the heavier endpoints (map queries, search, games).
limit_req_zone $binary_remote_addr zone=jetlag_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jetlag.sharankov.com;
    return 301 https://$host$request_uri;
}

server {
    # ("http2 on;" needs nginx 1.25.1+; this form works on every version,
    # with a deprecation warning on new ones.)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jetlag.sharankov.com;

    # The server's shared certificate (it covers this name too).
    ssl_certificate     /etc/letsencrypt/live/main_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/main_cert/privkey.pem;

    # Optional shared password for the whole site:
    # auth_basic "Jet Lag";
    # auth_basic_user_file /etc/nginx/jetlag.htpasswd;

    # Same privacy policy as the Authelia version: the browser may only talk
    # to this server. (e2e/csp.spec.ts runs the app under this policy.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # The app, rules pages, basemap tiles and reference data.
    location / {
        proxy_pass http://127.0.0.1:18780;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range requests for the .pmtiles basemap.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Shared games. Live game updates stream (server-sent
    # events), so no buffering and long reads; photos are up to ~6 MB.
    location /api/ {
        limit_req zone=jetlag_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:18787;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 7m;
    }

    # OpenStreetMap queries (prefix stripped: /overpass/api/... -> /api/...).
    location /overpass/ {
        limit_req zone=jetlag_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:18781/;
        proxy_read_timeout 300s;
        client_max_body_size 4m;
    }

}
