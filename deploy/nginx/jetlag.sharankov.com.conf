# Host nginx site for the app, e.g. /etc/nginx/sites-available/jetlag.sharankov.com
#
# The Authelia includes follow Authelia's nginx guide
# (https://www.authelia.com/integration/proxies/nginx/). Change their paths to
# whatever your other protected sites use.

server {
    listen 80;
    listen [::]:80;
    server_name jetlag.sharankov.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jetlag.sharankov.com;

    ssl_certificate     /etc/letsencrypt/live/jetlag.sharankov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetlag.sharankov.com/privkey.pem;

    # Authelia's internal auth endpoint.
    include snippets/authelia-location.conf;

    # The browser may only talk to this server: no trackers, CDNs or public
    # map services, even if someone adds one to the code later.
    # (e2e/csp.spec.ts runs the app under exactly this policy.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # The app (and basemap tiles).
    location / {
        include snippets/authelia-authrequest.conf;
        proxy_pass http://127.0.0.1:18780;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range requests for the .pmtiles basemap.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Share links. Authelia's snippet passes the user as Remote-User.
    location /api/ {
        include snippets/authelia-authrequest.conf;
        proxy_pass http://127.0.0.1:18787;
        proxy_set_header Host $host;
        client_max_body_size 4m;
    }

    # OpenStreetMap queries (prefix stripped: /overpass/api/... -> /api/...).
    location /overpass/ {
        include snippets/authelia-authrequest.conf;
        proxy_pass http://127.0.0.1:18781/;
        proxy_read_timeout 300s;
        client_max_body_size 4m;
    }

    # Place search (prefix stripped: /photon/api/ -> /api/).
    location /photon/ {
        include snippets/authelia-authrequest.conf;
        proxy_pass http://127.0.0.1:18782/;
    }
}
