# nginx inside the `web` container. TLS, Authelia and security headers are
# handled by the host's nginx (see jetlag.sharankov.com.conf).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output is fingerprinted, so it can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be re-checked for updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Basemap: one .pmtiles file, read in pieces with HTTP range requests.
    location /tiles/ {
        alias /tiles/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Reference datasets (places, stations, borders), rebuilt monthly.
    location /data/ {
        alias /datasets/;
        add_header Cache-Control "no-cache";
    }
}
