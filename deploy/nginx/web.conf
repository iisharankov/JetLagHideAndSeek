# nginx inside the `web` container. TLS, Authelia and security headers are
# handled by the host's nginx (see jetlag.sharankov.com.conf).
#
# deploy/test-nginx.sh runs this config against the built app and checks the
# content types, caching and range requests below.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # File types come from nginx's own list (mime.types, included at the http
    # level). A `types { }` block here would REPLACE that list, not add to it,
    # and everything would download as application/octet-stream.

    gzip on;
    gzip_vary on;
    # Not application/octet-stream: a gzipped response can't be served in
    # pieces, and the basemap (/tiles/) is read with range requests.
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/wasm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Types missing from (older) nginx lists: the web app manifest and the
    # ArcGIS geometry engine.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }

    # Build output is fingerprinted, so it can be cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be re-checked for updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Basemap: one .pmtiles file, read in pieces with HTTP range requests.
    location /tiles/ {
        alias /tiles/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Reference data (places, borders, elevation tiles…), rebuilt monthly.
    # The elevation tiles (.i16, octet-stream) compress well.
    location /data/ {
        alias /datasets/;
        gzip_types application/json application/octet-stream;
        add_header Cache-Control "no-cache";
    }
}
