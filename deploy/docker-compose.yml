# Self-hosted Jet Lag Hide and Seek. Every service listens on 127.0.0.1 only;
# the host's nginx puts them behind one domain with TLS and Authelia
# (see nginx/jetlag.sharankov.com.conf). Setup steps: deploy/README.md.
name: jetlag

services:
    # The app itself, plus the basemap at /tiles/ and reference data at /data/.
    web:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            target: web
            args:
                SITE_URL: "${SITE_URL:-https://jetlag.sharankov.com}"
        restart: unless-stopped
        ports:
            - "127.0.0.1:${WEB_PORT:-18780}:8080"
        volumes:
            - "${DATA_DIR:-./data}/tiles:/tiles:ro"
            - "${DATA_DIR:-./data}/datasets:/datasets:ro"
        # `docker compose ps` shows "healthy" once the app is being served.
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # Share links and shared games (live updates, photos).
    api:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            target: api
        restart: unless-stopped
        environment:
            # Where a tap on a push notification opens the app.
            SITE_URL: "${SITE_URL:-https://jetlag.sharankov.com}"
            # Who runs this server, for the browsers' push services (they only
            # use it to reach you if the server misbehaves): the site's
            # address unless you set a mailto: here.
            PUSH_CONTACT: "${PUSH_CONTACT:-}"
        ports:
            - "127.0.0.1:${API_PORT:-18787}:8787"
        volumes:
            - "${DATA_DIR:-./data}/api:/data"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # Downloads map data and builds the reference datasets; run with
    # `docker compose run --rm updater`.
    updater:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
            target: updater
        profiles: ["tools"]
        environment:
            BBOX: "${BBOX:-5.5,45.6,11.0,48.1}"
            MAX_ZOOM: "${MAX_ZOOM:-15}"
        volumes:
            - "${DATA_DIR:-./data}:/data"
